id: hc19_sparse_xml_positional
title: hc19 sparse xml positional
category: parser_bug
tags:
- medium-hard
- parser_bug
input_files:
- inputs/evidence.json
evaluation:
  type: keyword_rubric
  groups:
  - - omitted
    - sparse
    - missing cells are skipped
    - empty cells are not emitted
  - - shift
    - misalign
    - zip pairs wrong
  - - r attribute
    - cell reference
    - map by column letter
    - key on the ref
historical:
  notes: 'REAL BUG hit twice in one day (2026-08-22) parsing vendor xlsx exports:
    TI''s dense rows hid it; Infineon''s export mixes product types so sparse rows
    misaligned silently — a SiC module''s package landed in the VDS column. The fix
    used everywhere now: build a {column_letter: value} dict from each cell''s r attribute
    and join headers by letter, never by position.'
