id: hc20_dual_write_queue
title: hc20 dual write queue
category: distributed_design
tags:
- hard
- distributed_design
input_files:
- inputs/evidence.json
evaluation:
  type: keyword_rubric
  groups:
  - - 'returns sent: true even when the mount write failed'
    - false delivery
    - caller cannot distinguish queued from delivered
  - - verify
    - read-back
    - list the destination
    - existence check after write
  - - drain
    - replay
    - not scheduled
    - queue only works if the drain runs
  - - stale mount
    - mounted but dead
    - falls through to the underlying directory
    - mount health check
  - - fail loud
    - sync-intolerant
    - urgent messages must error
    - distinguish eventually-consistent from must-deliver
historical:
  notes: 'REAL SYSTEM, REAL INCIDENTS (our send-message.ts + drain-queue.sh evolution):
    every flaw in this case bit us — ''queued = sent'' belief, a drain loop that existed
    but was never loaded (launchd plist unloaded for weeks), a day of mail sitting
    in the wrong box, and TWICE a mounted-but-dead SMB session whose reads fell through
    to a local empty dir. Current design: dual-write with post-write existence v'
