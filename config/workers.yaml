# Fleet the harness can dispatch to.
# Add a box: copy a coder block, set model_key + endpoint, enabled: true.
# Remove a box: enabled: false. Change the model: swap model_key (and models.yaml).
# role is the job. failover_order is internal dead-box failover — not the pool.
# Endpoints are stable Tailscale IPs so a DHCP change cannot silently drop a worker.

workers:
  primary_coder:
    enabled: true
    role: coder
    model_key: dgx3_qwen
    endpoint: http://100.73.119.63:8900/v1
    capabilities:
      - coding
      - tool_calling
      - long_context
    failover_order: 1
    notes: spark-69c8 DGX3; Qwen3-Coder-Next SGLang with DFlash; sole dedicated coder, sized for 2-3 concurrent agents.

  dgx2_coder:
    enabled: false
    role: coder
    model_key: dgx2_qwen
    endpoint: http://100.116.221.82:8900/v1
    capabilities:
      - coding
      - tool_calling
      - long_context
    notes: spark-49af; retired from the active coder pool and available for a future TP2 or experiment lane

  asus_coder:
    enabled: false
    role: coder
    model_key: asus_qwen
    endpoint: http://100.124.181.13:8900/v1
    capabilities:
      - coding
      - tool_calling
      - long_context
    notes: gx10-fc2e; retired from the active coder pool and available for a future TP2 or experiment lane

  dgx3_coder:
    enabled: false
    role: coder
    model_key: dgx3_qwen
    endpoint: http://100.73.119.63:8900/v1
    capabilities:
      - coding
      - tool_calling
      - long_context
    notes: compatibility alias only; the same endpoint is active as primary_coder

  dgx3_designwins_ocr:
    enabled: false
    role: vision_ocr
    model_key: dgx3_designwins_ocr
    endpoint: http://100.73.119.63:8902/v1
    capabilities:
      - vision
      - document_layout
      - ocr
    notes: Disabled placeholder only. Do not displace the DGX3 coder until the 200-page DesignWins bakeoff and an explicit cutover.

  dgx3_designwins_extractor:
    enabled: false
    role: vision_extractor
    model_key: dgx3_designwins_extractor
    endpoint: http://100.73.119.63:8903/v1
    capabilities:
      - vision
      - structured_extraction
    notes: Disabled task-specific 8B placeholder. Low-confidence pages escalate directly to frontier vision; there is no general local-VLM fallback tier.

  fallback_reasoner:
    enabled: true
    role: foreman
    priority: 1
    model_key: m5_qwen
    endpoint: http://127.0.0.1:8082/v1
    capabilities:
      - reasoning
      - vision
      - tool_calling
    failover_order: 2
    notes: M5 carves packets; not in the coder pool. Foreman chain is m5_qwen then asus2_qwen (health-checked, auto). QA uses local Nemotron first and GLM 5.2 as the independent hosted fallback; Nemotron is never foreman.

  frontier_senior:
    enabled: true
    role: senior
    model_key: frontier
    endpoint: https://api.anthropic.com/v1
    capabilities:
      - review
      - vision
      - document_extraction
    failover_order: 3
    notes: single-call quality rescue after bounded local repair is exhausted; sole escalation path for unresolved vision/document pages; also available through manual harness rescue

  researcher:
    enabled: true
    role: critic
    priority: 1
    model_key: asus3_nemotron
    endpoint: http://100.89.118.36:8900/v1
    capabilities:
      - research
      - review
      - tool_calling
      - long_context
    notes: gx10-0309 samkimasus3; Nemotron 3.5 Lightning 30B-A3B NVFP4; primary local critic and researcher/tester ONLY — never foreman. With obsolete thinking retries removed it scored 7/7 in 3.78s alone and 7/7 in 5.47s or less across four concurrent grades; not a coder and not in the coding failover ladder.

  glm_critic:
    enabled: true
    role: critic
    priority: 2
    model_key: glm52
    endpoint: https://openrouter.ai/api/v1
    capabilities:
      - review
      - long_context
    notes: independent hosted critic fallback; used only when the local critic is unavailable or invalid

  nemotron_super_critic:
    enabled: true
    role: critic
    priority: 3
    model_key: nemotron_super
    endpoint: https://openrouter.ai/api/v1
    capabilities:
      - review
      - long_context
    notes: final hosted critic fallback; provider availability has been inconsistent

  spark_embedder:
    enabled: true
    role: embedder
    model_key: spark_embed
    endpoint: http://100.81.201.24:8800/v1
    capabilities:
      - embedding
      - semantic_search
    notes: spark-e10b :8800; bge-m3-cr-tapes-v1 (1024-dim, cuda); CR team weekly embeddings; routes /v1/embeddings /embed /encode /semantic-search; DO NOT restart or repurpose. This box is dedicated to embedding/search/training; its coder was retired 2026-08-27.

  asus2_foreman:
    enabled: true
    role: foreman
    priority: 2
    model_key: asus2_qwen
    endpoint: http://100.68.133.1:8888/v1
    capabilities:
      - reasoning
      - long_context
      - tool_calling
    notes: gx10-26b6 + gx10-33af; Qwen3.8 Flash Next NVFP4 SGLang TP2 with MTP2; peer foreman and overflow coding lane when M5 is unavailable. Distinct from Nemotron critic so QA stays adversarial. Not in the dedicated coder pool.

  secondary:
    enabled: false
    role: coder
    endpoint: http://future-dgx-pair-b:8000/v1
    capabilities:
      - coding
      - independent_review
    failover_order: 4

  fast:
    enabled: false
    role: coder
    endpoint: http://future-dgx-5:8000/v1
    capabilities:
      - coding
      - low_latency

  monster:
    enabled: false
    role: coder
    endpoint: http://future-monster:8000/v1
    capabilities:
      - coding
      - long_context
