# Cline / VS Code talks to this gateway, not to the raw model ports.
# Secrets stay in .env. The dummy key is only so Cline's form is not empty.
# Loopback accepts any key Cline sends. Prefer sk-harness-local in the UI.

listen_host: 127.0.0.1
listen_port: 8787
api_key: harness-local

# What Cline types into Model ID → harness model key (or "auto")
# Daily default is harness-local (Spark worker). harness-auto is dead-box only.
aliases:
  harness-auto: auto
  harness-local: dgx_qwen
  harness-m5: m5_qwen
  harness-frontier: frontier

# harness-auto tries these in order. Next tier only on connect/5xx/empty.
# Source of truth for names/roles is config/workers.yaml. Keep this list
# identical to enabled failover_order (tested).
# Bad answers do not escalate. Use `harness rescue PACKET.md` for quality.
auto_ladder:
  - dgx_qwen
  - m5_qwen
  - frontier

context_window: 131072
max_output_tokens: 8192
