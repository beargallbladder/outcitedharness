model_list:
  - model_name: local-coder
    litellm_params:
      model: openai/qwen38-flash-next-nvfp4-sglang
      api_base: http://100.68.133.1:8888/v1
      api_key: os.environ/QWEN38_API_KEY
      timeout: 900
      stream_timeout: 900
    model_info:
      mode: chat
      max_input_tokens: 262144

  - model_name: local-qwen38
    litellm_params:
      model: openai/qwen38-flash-next-nvfp4-sglang
      api_base: http://100.68.133.1:8888/v1
      api_key: os.environ/QWEN38_API_KEY
      timeout: 900
      stream_timeout: 900
    model_info:
      mode: chat
      max_input_tokens: 262144

  - model_name: local-critic
    litellm_params:
      model: openai/nemotron-lightning
      api_base: http://100.89.118.36:8900/v1
      api_key: none
      timeout: 300
      stream_timeout: 300
    model_info:
      mode: chat
      max_input_tokens: 32768

  - model_name: harness-orch
    litellm_params:
      model: openai/harness-orch
      api_base: http://127.0.0.1:8787/v1
      api_key: sk-harness-local
      timeout: 1800
      stream_timeout: 1800
    model_info:
      mode: chat
      max_input_tokens: 131072

  - model_name: frontier-claude
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 300
      stream_timeout: 300
    model_info:
      mode: chat
      max_input_tokens: 200000

litellm_settings:
  drop_params: false
  num_retries: 1
  request_timeout: 900
  telemetry: false

router_settings:
  enable_pre_call_checks: true
  num_retries: 1
  timeout: 900

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  background_health_checks: true
  health_check_interval: 30
  enforce_fallback_model_access: true
