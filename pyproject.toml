[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-harness"
version = "0.1.0"
description = "Local/cloud model tournament harness for measuring minimum capable model tier."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Harness" }]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "starlette>=0.38",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
vision = [
    "pymupdf>=1.26",
]

[project.scripts]
harness = "harness.cli:app"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
