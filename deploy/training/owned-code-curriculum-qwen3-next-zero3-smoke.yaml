### Load/step-only qualification for the 80B Qwen3-Coder-Next BF16 checkpoint.

model_name_or_path: /training/models/Qwen3-Coder-Next
trust_remote_code: true

stage: sft
do_train: true
finetuning_type: lora
lora_target: q_proj,k_proj,v_proj,o_proj,in_proj_qkvz,in_proj_ba,out_proj
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.0

dataset: coding_sft_train
dataset_dir: /training/datasets/owned-code-curriculum-v1/llamafactory
template: qwen3_nothink
cutoff_len: 256
max_samples: 1
overwrite_cache: true
preprocessing_num_workers: 1
dataloader_num_workers: 0

output_dir: /training/checkpoints/qwen3-next-zero3-lora-smoke-v1
logging_steps: 1
save_strategy: "no"
plot_loss: false
overwrite_output_dir: true
report_to: none

per_device_train_batch_size: 1
gradient_accumulation_steps: 1
gradient_checkpointing: true
learning_rate: 0.0001
max_steps: 1
lr_scheduler_type: constant
warmup_ratio: 0.0
bf16: true
seed: 1788172800
data_seed: 1788172800
disable_shuffling: true
ddp_find_unused_parameters: false
ddp_timeout: 180000000
deepspeed: /training/configs/deepspeed-zero3-qwen3-next.json
